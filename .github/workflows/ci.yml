name: CI

on:
  push:
    branches: [dev, main]
  # pull_request에는 base 제한을 두지 않는다. `branches: [dev, main]`로 막으면
  # feature 브랜치를 base로 하는 PR이 CI를 **전혀 돌지 않는다** — 스택형 PR
  # (기능 브랜치 위에 후속 작업을 쌓고 그 사이를 PR로 여는 방식)에서 검증 없이
  # 코드가 올라간다. 게이트는 base가 무엇이든 걸려야 한다.
  pull_request:

jobs:
  ci:
    name: Lint / Build / Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hyunwoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hyunwoo_test

      - name: Lint
        run: pnpm lint:ci

      - name: Type Check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:cov
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hyunwoo_test
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2a$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewdBPj/zo.RvCNPC
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: placeholder
          R2_PUBLIC_URL: https://placeholder.r2.dev
          ALLOWED_ORIGINS: http://localhost:3000
